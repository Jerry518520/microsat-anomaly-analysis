# RAG 系统配置
# 用于卫星异常知识库问答系统

# ========== 嵌入模型配置 ==========
embedding:
  # ⚠ 嵌入模型路径的**唯一真相源是环境变量 EMBEDDING_MODEL_PATH**（在 .env 中配置），
  #    本键不再存放模型标识，**必须保持为 null**。
  #
  # 为什么（实测证据）：
  #   1. 本项目运行在离线/内网环境。实测 huggingface.co 直连 8s 超时不可达，
  #      只有 hf-mirror.com 可达；把 BAAI/bge-m3 写死为默认值，等于让每次
  #      冷启动都隐式触发 2.2GB 联网下载，不可靠也不可接受。
  #   2. 曾经的分叉：build_index.py 用本键（BAAI/bge-m3）建索引，运行时
  #      src/rag/embedding.py 用 .env 的 EMBEDDING_MODEL_PATH（models/Xorbits/bge-m3）。
  #      两边权重一旦不同，索引与查询向量就落在不同向量空间——检索结果
  #      静默劣化，不报任何错。
  #   3. 已实算验证 models/Xorbits/bge-m3 与 BAAI/bge-m3 为**同一份权重**
  #      （pytorch_model.bin md5 均为 767f43f2a03a47fce93b3ab353f209d0），
  #      同文本编码后向量逐元素相同（max|Δ|=0.0，余弦=1.0），因此改用本地
  #      路径不会改变任何检索结果。
  #
  # 解析实现：src/rag/embedding.py::resolve_embedding_model_path()
  #   - 未设置 EMBEDDING_MODEL_PATH -> 抛 EmbeddingModelPathError 并给出
  #     可操作提示（不静默回退到任何其他模型）
  #   - 目录缺权重文件（如下载中断残留的 models/bge-m3/）-> 明确报错
  model_name: null
  # 说明：本键为 null 时，模型路径**只能**由 EMBEDDING_MODEL_PATH 提供。
  # 保持为 null 即可让 src/rag/embedding.py 与 scripts/build_index.py 走同一份
  # 解析逻辑；tests/test_rag/test_embedding_model_path.py 有防回归测试，
  # 任何人把它改回具体模型名（或与 .env 指向不同权重）都会导致测试失败。

  device: "cuda"  # CUDA 加速（必须）
  batch_size: 32  # 批处理大小（GPU 优化）
  
  # 模型参数
  normalize_embeddings: true  # 归一化嵌入向量
  show_progress_bar: true     # 显示进度条
  max_length: 512            # 最大输入长度
  
  # 缓存配置
  cache_dir: "data/embeddings_cache"  # 嵌入向量缓存目录
  use_cache: true                     # 是否使用缓存

# ========== 向量数据库配置 ==========
vectorstore:
  # FAISS 配置
  type: "faiss"              # 向量数据库类型
  index_type: "Flat"         # 索引类型：Flat（精确搜索），可选 IVFxxx
  metric: "cosine"           # 相似度度量：cosine / l2
  
  # 持久化配置
  persist_directory: "data/vectorstore"  # 向量库持久化目录
  auto_save: true                       # 自动保存
  
  # GPU 加速
  use_gpu: false            # faiss-cpu（Python 3.13 无 faiss-gpu wheel）
  gpu_id: 0                 # GPU ID

# ========== 文档处理配置 ==========
document:
  # PDF 处理
  pdf_processor: "pypdf2"   # PDF 解析库
  
  # 文本切分策略
  chunking:
    strategy: "recursive"   # 递归切分策略
    chunk_size: 512         # 块大小（字符数）
    chunk_overlap: 50       # 块重叠（字符数）
    
  # 元数据提取（用于页码溯源）
  metadata:
    extract_page_numbers: true      # 提取页码
    extract_section_titles: true    # 提取章节标题
    extract_document_info: true     # 提取文档信息
    
  # 知识库文档（带优先级）
  knowledge_base:
    - name: "NASA SOA 2024"
      file_path: "docs/knowledge_base/NASA_SOA_2024.pdf"
      priority: 1           # 最高优先级
      language: "en"        # 英文
      
    - name: "Ruszczak OPS-SAT AD 2025"
      file_path: "docs/papers/！Ruszczak_OPS-SAT_AD_ScientificData_2025.pdf"
      priority: 2           # 核心一手资料(ESA工程师标注)
      language: "en"        # 英文
      
    - name: "MAXWELL Mission Handbook"
      file_path: "docs/knowledge_base/MAXWELL_Mission_Handbook.pdf"
      priority: 3           # 补充(另一颗星)
      language: "en"        # 英文
      
    - name: "ITU Small Satellite Handbook CN"
      file_path: "docs/knowledge_base/ITU_Small_Satellite_Handbook_R-HDB-65-2023_CN.pdf"
      priority: 4           # 补充
      language: "zh"        # 中文
      
    - name: "ITU Small Satellite Handbook EN"
      file_path: "docs/knowledge_base/ITU_Small_Satellite_Handbook_R-HDB-65-2023_EN.pdf"
      priority: 5           # 补充
      language: "en"        # 英文
      
    - name: "Experiment Knowledge Base"
      file_path: "docs/knowledge_base/experiment_knowledge.md"
      priority: 0           # 最高优先级(项目实验发现)
      language: "zh"        # 中文

# ========== 检索配置 ==========
retrieval:
  # 检索参数
  top_k: 5                  # 返回 top-k 相关文档块
  # 相似度阈值。BGE-M3 归一化向量在本库实测 top-15 落在 0.45~0.67（p50≈0.52，
  # P(score>=0.7)=0%），故 0.7 会让检索恒返回空，0.3 实测 100% 通过、
  # 等价于不设限。这里保留 0.3 作为「绝对下限」，真正的把关靠rel_delta +
  # filter_low_quality，低分结果改为标记 low_confidence 而非丢弃。
  score_threshold: 0.3
  max_tokens: 2000          # 检索内容最大token 数

  # 候选池深度：priority 保留席位 + 每源上限需要比 top_k 更深的候选
  candidate_pool_k: 40

  # --- priority 融合（BGE-M3 分数区间窄，不做简单加权，见 src/rag/retrieval_policy.py）---
  # 相对竞争区宽度：分数低于 top_score - rel_delta 的候选不享受 priority 保留席位
  rel_delta: 0.12
  # priority <= 该值的源可占用保留席位（0=项目实验结论，2=OPS-SAT 论文）
  reserve_priority_max: 2
  # 保留席位数上限，null = max(1, top_k//2)，保证 priority 最多影响一半结果
  max_reserved: null
  # priority -> 同源入选上限（priority 数字越小越优先）
  priority_caps:
    0: 3
    1: 3
    2: 2
    3: 2
    4: 1
    5: 1

  # --- 低质量片段过滤（PDF 换页残片/ 目录页）---
  filter_low_quality: true
  min_chunk_chars: 80      # 有效字符数下限
  max_junk_ratio: 0.55     # 标点空白占比上限

  # top1 分数低于此值时标记 low_confidence 并在上下文中提示，不静默丢弃
  low_confidence_threshold: 0.45
  
  # 混合检索策略
  hybrid_search: true      # 是否启用混合检索（关键词+向量）
  keyword_weight: 0.3       # 关键词检索权重
  vector_weight: 0.7        # 向量检索权重

# ========== LLM API 配置 ==========
llm:
  # 切换为 DeepSeek 官方 OpenAI 兼容端点
  # 原因：① 火山方舟模型 deepseek-v3-2-251201 已不可访问（404 InvalidEndpointOrModel.NotFound）；
  #       ② 提供的 DEEPSEEK_API_KEY（sk- 开头）为 DeepSeek 官方平台密钥，无法在 Ark 端点认证（401 API key format is incorrect）。
  # 密钥经 .env 的 DEEPSEEK_API_KEY 注入，本文件不含任何明文密钥。
  provider: "deepseek"
  api_base: "https://api.deepseek.com/v1/chat/completions"
  model: "deepseek-chat"
  
  # API 认证（从环境变量读取）
  api_key_env: "DEEPSEEK_API_KEY"  # 环境变量名
  
  # 请求参数
  temperature: 0.1          # 温度（低值保证确定性）
  max_tokens: 2048          # 最大生成 token 数（原1024太小，系统提示词+上下文占完后Section 6被截断）
  top_p: 0.9                # 核采样
  
  # 超时设置
  timeout: 60               # API 调用超时（秒）
  max_retries: 3            # 最大重试次数（含首次，即最多打3 次）

  # 指数退避参数：第 n 次失败后等待 base * factor^(n-1)，封顶 cap
  # 实测（改前 3 次紧邻重试、零 sleep）：401 场景总耗时 1.58s 纯属白等；
  # 429/网络错误 0.00s 打完就放弃，服务端来不及恢复。
  # 改后：401/403 首次即失败（0.00s，1 次尝试）；429/超时按 1s→2s 退避。
  retry_backoff_base: 1.0
  retry_backoff_factor: 2.0
  retry_backoff_cap: 30.0

# ========== Prompt 模板配置 ==========
prompt:
  # 系统提示词：不设置本键（或设为空串）时，使用 `src/rag/prompts.py`
  # 中的 default_system_prompt（7 段式防幻觉+溯源提示词，748 字）。
  # 历史缺陷说明：此处曾写 `system_prompt: ""`，而代码原用
  # `dict.get("system_prompt", default)`，dict.get 仅在键不存在时才返回默认值，
  # 键存在且为空串时会返回空串，导致默认提示词被静默吞掉、system 消息根本未发送。
  # 代码已改为 `get(...) or default`（空值同样回落），本键也从配置中移除。
  # 若需自定义，请直接填写完整提示词文本。
  # 用户提示词模板
  user_template: |
    请分析以下卫星遥测通道异常的可能原因：
    
    通道ID: {channel_id}
    异常类型: {anomaly_type}
    异常描述: {anomaly_description}
    
    参考知识：
    {context}
    
    请给出分析结果，并标注知识来源。
  
  # 来源标注格式
  citation_format: "【来源：{document_name} 第 {page_number} 页】"

# ========== 日志与监控配置 ==========
logging:
  level: "INFO"            # 日志级别
  file: "logs/rag_system.log"  # 日志文件
  rotation: "10 MB"        # 日志轮转大小
  
  # 性能监控
  enable_monitoring: true
  monitor_metrics:
    - "retrieval_latency"
    - "embedding_time"
    - "llm_response_time"

# ========== 系统配置 ==========
system:
  # 工作目录
  workspace: "data/rag_workspace"
  
  # 缓存配置
  enable_cache: true
  cache_ttl: 3600  # 缓存过期时间（秒）
  
  # 并行处理
  max_workers: 4   # 最大工作线程数
  
  # 调试模式
  debug: false
