# microsat-anomaly-analysis 全局配置

# 数据路径
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  results_dir: "data/results"
  segments_file: "segments.csv"
  features_file: "dataset-提取的合成特征被计算到每个手动分割和标记的遥测段上.csv"

# 模型参数
model:
  iforest:
    n_estimators: 100
    max_samples: "auto"
    contamination: 0.2
    random_state: 42
  adaboost:
    n_estimators: 100
    random_state: 42

# 评估参数
evaluation:
  metrics:
    - f1
    - auc_roc
    - accuracy
    - precision
    - recall
  per_channel: true     # 是否分通道计算指标

# RAG 参数已统一到 configs/rag_config.yaml
